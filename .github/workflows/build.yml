name: Build OptiScaler

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  UPSTREAM_REPO: optiscaler/OptiScaler
  UPSTREAM_BRANCH: master

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            msbuild_platform: x64
          - platform: x86
            msbuild_platform: Win32

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          submodules: recursive
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release ${{ matrix.platform }}
        shell: cmd
        run: msbuild OptiScaler.sln /p:Configuration=Release /p:Platform=${{ matrix.msbuild_platform }} /m

      - uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-${{ matrix.platform }}
          path: OptiScaler\bin\${{ matrix.platform }}-Release\*
          compression-level: 9

  release:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Package artifacts
        shell: bash
        run: |
          for dir in */; do
            dir=${dir%/}
            zip -r "${dir}.zip" "$dir"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: OptiScaler Nightly Build #${{ github.run_number }}
          body: |
            Auto-built from ${{ env.UPSTREAM_REPO }} (${{ env.UPSTREAM_BRANCH }})
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: "*.zip"
          make_latest: true
          fail_on_unmatched_files: false
