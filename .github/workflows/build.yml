name: Build OptiScaler

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  REPO: optiscaler/OptiScaler
  BRANCH: master

jobs:
  check-commits:
    runs-on: ubuntu-latest
    outputs:
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check last built commit
        id: check
        run: |
          LAST_BUILT_SHA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=1" | jq -r '.artifacts[0].workflow_run.head_sha // "none"')
          LATEST_SHA=$(curl -s "https://api.github.com/repos/${{ env.REPO }}/branches/${{ env.BRANCH }}" | jq -r '.commit.sha')
          echo "Last built: $LAST_BUILT_SHA"
          echo "Latest:     $LATEST_SHA"
          if [ "$LAST_BUILT_SHA" = "none" ] || [ "$LATEST_SHA" != "$LAST_BUILT_SHA" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "commit_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-commits
    if: ${{ needs.check-commits.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]
        config: [Release]
        include:
          - arch: x64
            platform: x64
          - arch: Win32
            platform: x86

    steps:
      - name: Checkout OptiScaler
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.BRANCH }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.config }} ${{ matrix.platform }}
        run: |
          msbuild OptiScaler.sln /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.arch }} /m

      - name: Upload artifacts (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            OptiScaler\bin\${{ matrix.platform }}-${{ matrix.config }}\*
          compression-level: 9

  create-release:
    needs: [check-commits, build]
    if: always() && (needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create ZIP packages
        shell: bash
        run: |
          for dir in */; do
            dir=${dir%/}
            zip -r "${dir}.zip" "$dir"
          done

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OptiScaler Build ${{ steps.tag.outputs.tag }}
          body: |
            Auto-build from ${{ env.REPO }} @ ${{ env.BRANCH }}
            Commit: ${{ needs.check-commits.outputs.commit_sha || github.sha }}
          files: |
            *.zip
          make_latest: true
          fail_on_unmatched_files: false
